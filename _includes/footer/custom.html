<!-- start custom footer snippets -->
<div class="footer-contact">
  <p class="footer-contact__name">{{ site.name }} &middot; {{ site.author.location }}</p>
  <p>
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a> &middot; {% endif %}
    {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a> &middot; {% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
  </p>
</div>
<a href="/sitemap/">Sitemap</a>
<!-- end custom footer snippets -->
